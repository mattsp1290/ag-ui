[package]
name = "ag-ui-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Core type library for the AG-UI protocol."
license = "MIT"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
json-patch = "4"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
